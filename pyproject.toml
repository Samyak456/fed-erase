[build-system]
requires = ["setuptools>=61.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fed-erase"
version = "0.1.0"
description = "Resource-Adaptive Federated Unlearning Framework for Distributed Machine Learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["federated-learning", "machine-unlearning", "privacy", "pytorch"]

dependencies = [
    "torch>=2.2.0,<3.0",
    "torchvision>=0.17.0,<1.0",
    "numpy>=1.26.0,<2.0",
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "pyyaml>=6.0.1,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-mock>=3.12.0,<4.0",
    "ruff>=0.4.0,<1.0",
    "mypy>=1.9.0,<2.0",
]

# Future phases — not installed by default
api = [
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
    "sqlalchemy>=2.0.29,<3.0",
    "alembic>=1.13.0,<2.0",
]
fl = [
    "flwr>=1.8.0,<2.0",
    "flwr-datasets>=0.1.0,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ml*",
    "contribution*",
    "unlearning*",
    "evaluation*",
    "scheduler*",
    "database*",
    "apps*",
]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations (type hints)
    "D",    # pydocstyle
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
]
ignore = [
    "D100",    # missing docstring in public module   (added per-file)
    "D104",    # missing docstring in public package  (added in __init__)
    "D203",    # one-blank-line-before-class          (conflicts with D211)
    "D213",    # multi-line-summary-second-line        (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",   # no type annotations required in tests
    "D",     # no docstrings required in tests
]
"scripts/*" = [
    "ANN",   # no type annotations required in scripts
]

[tool.ruff.lint.isort]
known-first-party = ["ml", "contribution", "unlearning", "evaluation", "scheduler", "database", "apps"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"
# --no-header keeps output clean; empty-collection exit-0 avoids false CI failures
# before test files are written in Tasks 3–10
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "unit: fast, pure-logic tests with no I/O (< 1s each)",
    "integration: tests that touch disk, real datasets, or external processes",
    "slow: full training runs or anything taking > 10s",
    "fl: requires Flower simulation runtime",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["ml", "contribution", "unlearning", "evaluation", "scheduler"]
omit = ["tests/*", "scripts/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_reexport = true
# Start with moderate strictness; tighten per phase
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
# Ignore missing stubs for third-party packages that lack them
[[tool.mypy.overrides]]
module = [
    "yaml",
    "torchvision.*",
    "torch.*",
]
ignore_missing_imports = true
